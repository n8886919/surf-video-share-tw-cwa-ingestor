configuration:
  worker_base_url:
    name: Worker 基底網址
    description: 彼日浪影 Worker 的 HTTPS origin；不可包含路徑或 query string。
  cwa_api_key:
    name: CWA 授權碼
    description: 中央氣象署開放資料授權碼，只會從此 App 的受保護 options 讀取。
  ingestion_secret:
    name: 預報匯入密鑰
    description: 僅與 Worker FORECAST_INGESTION_SECRET 共用的高熵密鑰。
